name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group test
      - name: Public Python tests
        run: uv run --locked --no-sync python -m unittest discover -s tests -t . -v
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: JavaScript tests
        run: node --test tests/*.test.mjs
      - name: Build package and verify import
        run: |
          uv build
          uv run --locked --no-sync python -c "import skyshard_tracker; import skyshard_tracker.cli; print('package import OK')"
